# B站AI摘要 - GitHub Actions 工作流
# 定时监控: 每天 08:00 / 20:00 (北京时间 = UTC+8, cron 用 UTC)
# Web触发: 通过 workflow_dispatch 处理单条视频
# Secrets: SILICONFLOW_API_KEY / SMTP_USER / SMTP_PASS / SMTP_TO
name: B站AI摘要

on:
  schedule:
    - cron: '0 0,12 * * *'   # UTC 0:00/12:00 = 北京时间 8:00/20:00
  workflow_dispatch:
    inputs:
      bvid:
        description: 'B站视频 BV 号 (留空则运行自动监控)'
        required: false
        default: ''
        type: string
      job_id:
        description: '任务 ID (可选)'
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: 1

jobs:
  # -----------------------------------------------------------
  # 自动监控 (定时触发 或 无输入的手动触发)
  # -----------------------------------------------------------
  monitor:
    if: ${{ inputs.bvid == '' || inputs.bvid == null }}
    name: UP主监控
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: bilibili_summary/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r bilibili_summary/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg yt-dlp

      - name: 注入配置
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python bilibili_summary/inject_config.py

      - name: 运行监控
        run: |
          cd bilibili_summary
          [ ! -f state.json ] && echo '{"processed":{}}' > state.json
          python monitor.py

      - name: 保存状态
        if: success() || failure()
        run: |
          cd bilibili_summary
          if [ -f state.json ] && ! git diff --quiet HEAD -- state.json 2>/dev/null; then
            git config user.name "bilibili-bot"
            git config user.email "bot@bilibili-summary.local"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
            echo "state.json updated"
          else
            echo "state.json unchanged, skip"
          fi

  # -----------------------------------------------------------
  # 单条处理 (通过 Worker API 触发)
  # -----------------------------------------------------------
  process_single:
    if: ${{ inputs.bvid != '' && inputs.bvid != null }}
    name: 处理单条视频
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: bilibili_summary/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r bilibili_summary/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg yt-dlp

      - name: 注入配置
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python bilibili_summary/inject_config.py

      - name: 处理视频 (音频 -> 语音识别 -> AI总结)
        id: process
        env:
          BVID: ${{ inputs.bvid }}
        run: |
          cd bilibili_summary
          python process_single.py "$BVID" > result.json

      - name: 发送邮件通知
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          cd bilibili_summary
          python send_result_email.py result.json
