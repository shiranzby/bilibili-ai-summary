# B站AI摘要 - GitHub Actions 工作流
# 用途: 由 Worker API 触发，处理单条视频并发送邮件
# 触发: 仅 workflow_dispatch (不设定时，监控在主仓库)
# Secrets: SILICONFLOW_API_KEY / SMTP_USER / SMTP_PASS / SMTP_TO
name: B站AI摘要

on:
  workflow_dispatch:
    inputs:
      bvid:
        description: 'B站视频 BV 号'
        required: true
        type: string
      job_id:
        description: '任务 ID (可选)'
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ──────── 单条处理 (通过 Worker API 触发) ────────
  process_single:
    if: ${{ inputs.bvid != '' && inputs.bvid != null }}
    name: 处理单条视频
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: bilibili_summary/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r bilibili_summary/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 注入配置
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python bilibili_summary/inject_config.py

      - name: 处理视频 (音频 → 语音识别 → AI总结)
        id: process
        env:
          BVID: ${{ inputs.bvid }}
        run: |
          cd bilibili_summary
          python process_single.py "$BVID" > result.json

      - name: 发送邮件通知
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          cd bilibili_summary
          python send_result_email.py result.json
