# B站UP主视频监控 - GitHub Actions 工作流
# 定时: 每天 08:00 / 20:00 (北京时间 = UTC+8, cron 用 UTC)
# Secrets: ZHIPU_API_KEY, SMTP_USER, SMTP_PASS, SMTP_TO, SILICONFLOW_API_KEY
name: B站视频监控

on:
  schedule:
    - cron: '0 0,12 * * *'   # UTC 0:00/12:00 = 北京时间 8:00/20:00
  workflow_dispatch:

permissions:
  contents: write   # 允许 git push state.json

jobs:
  monitor:
    name: B站监控
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: bilibili_monitor/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r bilibili_monitor/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 注入配置
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python bilibili_monitor/inject_config.py

      - name: 运行监控
        run: |
          cd bilibili_monitor
          [ ! -f state.json ] && echo '{"processed":{}}' > state.json
          python monitor.py

      - name: 保存状态
        if: success() || failure()
        run: |
          cd bilibili_monitor
          if [ -f state.json ] && ! git diff --quiet HEAD -- state.json 2>/dev/null; then
            git config user.name "bilibili-bot"
            git config user.email "bot@bilibili-monitor.local"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
            echo "📤 state.json 已推送"
          else
            echo "ℹ state.json 无变化，跳过推送"
          fi
