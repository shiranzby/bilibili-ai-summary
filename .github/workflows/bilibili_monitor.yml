name: B站视频监控

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: B站监控
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: 安装依赖
        run: |
          pip install -r bilibili_monitor/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install yt-dlp
      - name: 运行监控
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd bilibili_monitor
          if [ ! -f state.json ]; then echo '{"processed":{}}' > state.json; fi
          sed -i "s|ZHIPU_API_KEY = ""|ZHIPU_API_KEY = "$ZHIPU_API_KEY"|" config.py
          sed -i "s|SMTP_USER = ""|SMTP_USER = "$SMTP_USER"|" config.py
          sed -i "s|SMTP_PASS = ""|SMTP_PASS = "$SMTP_PASS"|" config.py
          sed -i "s|SMTP_TO = ""|SMTP_TO = "$SMTP_TO"|" config.py
          sed -i "s|HF_TOKEN = ""|HF_TOKEN = "$HF_TOKEN"|" config.py
          python monitor.py
      - name: 保存状态
        run: |
          git config user.name bot
          git config user.email bot@bot
          git diff --quiet bilibili_monitor/state.json || (git add bilibili_monitor/state.json && git commit -m state && git push)
