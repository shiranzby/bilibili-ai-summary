name: B站视频监控

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: B站监控
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: 安装依赖
        run: |
          pip install -r bilibili_monitor/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install yt-dlp
      - name: 注入配置
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python bilibili_monitor/inject_config.py
      - name: 运行监控
        run: python bilibili_monitor/monitor.py
      - name: 保存状态
        run: |
          git config user.name bot
          git config user.email bot@bot
          git diff --quiet bilibili_monitor/state.json || (git add bilibili_monitor/state.json && git commit -m state && git push)
