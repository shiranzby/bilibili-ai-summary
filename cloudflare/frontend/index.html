<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站AI摘要 — 手动转录</title>
<style>
/* ═══════════════════════════════════════════════
   Reset & Variables
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8fafc;
  --surface: rgba(255,255,255,0.85);
  --surface-border: rgba(203,213,225,0.7);
  --text: #0f172a;
  --text-soft: #475569;
  --text-muted: #94a3b8;
  --brand: #14b8a6;
  --brand-hover: #0d9488;
  --accent: #0ea5e9;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 14px;
  --shadow: 0 4px 16px rgba(15,23,42,0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: rgba(30,41,59,0.85);
  --surface-border: rgba(51,65,85,0.7);
  --text: #f1f5f9;
  --text-soft: #cbd5e1;
  --text-muted: #64748b;
  --shadow: 0 4px 16px rgba(0,0,0,0.2);
}
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ═══════════════════════════════════════════════
   Layout
   ═══════════════════════════════════════════════ */
.container {
  max-width: 880px;
  margin: 0 auto;
  padding: 32px 20px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 12px;
}
h1 {
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text-soft);
  transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--brand); }

/* ═══════════════════════════════════════════════
   Cards
   ═══════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  transition: background 0.3s, border-color 0.3s;
}
.card-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
}

/* ═══════════════════════════════════════════════
   Form
   ═══════════════════════════════════════════════ */
.input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.input-row input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  background: rgba(255,255,255,0.7);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
}
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--accent));
  color: #fff;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20,184,166,0.3); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--surface-border);
  color: var(--text-soft);
}
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-danger {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 6px 12px;
  font-size: 0.8rem;
}
.btn-danger:hover { background: var(--danger); color: #fff; }
.hint {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ═══════════════════════════════════════════════
   Stats
   ═══════════════════════════════════════════════ */
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--text-soft);
}
.stat strong { color: var(--text); }
.stat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.stat-dot.pending { background: #f59e0b; }
.stat-dot.done { background: var(--success); }
.progress-bar {
  height: 4px;
  background: var(--surface-border);
  border-radius: 4px;
  margin-top: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ═══════════════════════════════════════════════
   Job List
   ═══════════════════════════════════════════════ */
.job-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--surface-border);
}
.job-item:last-child { border-bottom: none; }
.job-status {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 800;
  flex-shrink: 0;
}
.job-status.pending { background: #fef3c7; color: #92400e; }
.job-status.running { background: #dbeafe; color: #1e40af; }
.job-status.done { background: #dcfce7; color: #166534; }
.job-status.failed { background: #fee2e2; color: #991b1b; }
.job-info { flex: 1; min-width: 0; }
.job-bvid { font-weight: 700; font-size: 0.9rem; }
.job-time { font-size: 0.8rem; color: var(--text-muted); }
.job-title { font-size: 0.85rem; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-actions { display: flex; gap: 6px; flex-shrink: 0; }
.job-empty {
  text-align: center;
  padding: 32px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* ═══════════════════════════════════════════════
   Modal
   ═══════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--bg);
  border: 1px solid var(--surface-border);
  border-radius: 18px;
  padding: 28px;
  max-width: 640px;
  width: calc(100% - 40px);
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 1.2rem; margin-bottom: 16px; }
.modal-close {
  float: right;
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
}
.modal-section { margin-bottom: 16px; }
.modal-section h3 {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.modal-section .content {
  font-size: 0.92rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ═══════════════════════════════════════════════
   Spinner
   ═══════════════════════════════════════════════ */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--surface-border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}

/* ═══════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 600;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.error { background: var(--danger); }

/* ═══════════════════════════════════════════════
   Responsive
   ═══════════════════════════════════════════════ */
@media (max-width: 640px) {
  .container { padding: 20px 14px; }
  .card { padding: 16px; }
  .input-row { flex-direction: column; }
  .input-row input { min-width: 0; }
  .job-actions { flex-direction: column; }
}

/* ═══════════════════════════════════════════════
   Tab bar
   ═══════════════════════════════════════════════ */
.tab-bar {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 14px;
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
}
.tab-btn {
  flex: 1;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-soft);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--brand), var(--accent));
  color: #fff;
  box-shadow: 0 2px 8px rgba(20,184,166,0.2);
}
.tab-btn:hover:not(.active) { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Header -->
  <header>
    <h1>🎬 B站AI摘要</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="statusBadge" class="stat" style="font-size:0.8rem"></span>
      <button class="theme-toggle" onclick="toggleTheme()">🌓 主题</button>
    </div>
  </header>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="submit" onclick="switchTab('submit')">📝 新建转录</button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 历史记录</button>
  </div>

  <!-- Tab: Submit -->
  <div id="tab-submit" class="tab-content">
    <div class="card">
      <div class="card-title">提交新任务</div>
      <div class="input-row">
        <input id="urlInput" type="text"
          placeholder="B站视频链接或 BV 号…"
          onkeydown="if(event.key==='Enter') submitJob()" />
        <button class="btn btn-primary" id="submitBtn" onclick="submitJob()">
          开始处理
        </button>
      </div>
      <p class="hint">
        支持: https://www.bilibili.com/video/BVxxx / b23.tv/xxx / 直接输入BV号
      </p>
      <div id="submitStatus" style="margin-top:12px;display:none"></div>
    </div>
  </div>

  <!-- Tab: History -->
  <div id="tab-history" class="tab-content" style="display:none">
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>任务列表</span>
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.8rem" onclick="refreshList()">🔄 刷新</button>
      </div>
      <div class="stats" id="statsBar"></div>
      <div id="jobList"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// Configuration
// ═══════════════════════════════════════════════════════
const API_BASE = '';  // Proxy same-origin via Worker, or set full URL
const POLL_INTERVAL = 5000;  // 5 seconds

// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════
let currentTab = 'submit';
let pollTimer = null;
let jobBeingSubmitted = false;

// ═══════════════════════════════════════════════════════
// Theme
// ═══════════════════════════════════════════════════════
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
(function() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

// ═══════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ═══════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════
async function api(path, options = {}) {
  const url = API_BASE + path;
  const resp = await fetch(url, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options,
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  return data;
}

// ═══════════════════════════════════════════════════════
// Submit Job
// ═══════════════════════════════════════════════════════
async function submitJob() {
  if (jobBeingSubmitted) return;
  const input = document.getElementById('urlInput');
  const url = input.value.trim();
  if (!url) { showToast('请先输入视频链接', true); return; }

  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('submitStatus');
  jobBeingSubmitted = true;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 提交中…';
  status.style.display = 'block';
  status.innerHTML = '<span class="spinner"></span> 正在提交…';

  try {
    const data = await api('/api/submit', {
      method: 'POST',
      body: JSON.stringify({ url }),
    });
    showToast(`✅ 已提交: ${data.bvid}`, false);
    status.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;font-size:0.9rem">
        <span class="job-status pending">⏳</span>
        <span>任务已提交，正在队列中等待处理…</span>
      </div>
      <div style="margin-top:8px;font-size:0.82rem;color:var(--text-muted)">
        ID: ${data.job_id}
      </div>`;
    input.value = '';
    // Auto switch to history after short delay
    setTimeout(() => switchTab('history'), 1500);
  } catch (err) {
    showToast('❌ ' + err.message, true);
    status.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
  } finally {
    jobBeingSubmitted = false;
    btn.disabled = false;
    btn.textContent = '开始处理';
  }
}

// ═══════════════════════════════════════════════════════
// List & Status
// ═══════════════════════════════════════════════════════
async function refreshList() {
  const listEl = document.getElementById('jobList');
  const statsEl = document.getElementById('statsBar');

  try {
    const [jobsData, statsData] = await Promise.all([
      api('/api/jobs?limit=50'),
      api('/api/stats'),
    ]);

    // Stats bar
    const pending = jobsData.jobs.filter(j => j.status === 'pending').length;
    const running = jobsData.jobs.filter(j => j.status === 'running').length;
    const done = jobsData.jobs.filter(j => j.status === 'completed').length;
    const failed = jobsData.jobs.filter(j => j.status === 'failed').length;

    statsEl.innerHTML = `
      <span class="stat"><strong>${jobsData.total}</strong> 个任务</span>
      <span class="stat"><span class="stat-dot pending"></span> ${pending} 待处理</span>
      <span class="stat"><span class="stat-dot" style="background:var(--accent)"></span> ${running} 处理中</span>
      <span class="stat"><span class="stat-dot done"></span> ${done} 完成</span>
      ${failed ? `<span class="stat"><span class="stat-dot" style="background:var(--danger)"></span> ${failed} 失败</span>` : ''}
      <span class="stat">📦 ${statsData.completed_jobs}/${statsData.max_results} 条结果</span>
      <div class="progress-bar" style="flex:1;min-width:60px;margin-top:0">
        <div class="progress-fill" style="width:${Math.min(100, (statsData.completed_jobs/statsData.max_results)*100)}%"></div>
      </div>
    `;

    // List
    if (jobsData.jobs.length === 0) {
      listEl.innerHTML = '<div class="job-empty">暂无任务，去「新建转录」提交吧</div>';
      return;
    }

    listEl.innerHTML = jobsData.jobs.map(job => {
      const statusIcon = job.status === 'pending' ? '⏳' :
                         job.status === 'running' ? '🔄' :
                         job.status === 'completed' ? '✅' :
                         job.status === 'failed' ? '❌' : '📄';
      const statusClass = job.status === 'pending' ? 'pending' :
                          job.status === 'running' ? 'running' :
                          job.status === 'completed' ? 'done' : 'failed';
      return `
        <div class="job-item">
          <div class="job-status ${statusClass}">${statusIcon}</div>
          <div class="job-info">
            <div class="job-bvid">${job.bvid}</div>
            <div class="job-title">${job.title || '等待处理…'}</div>
            <div class="job-time">${formatTime(job.created_at)}</div>
          </div>
          <div class="job-actions">
            <button class="btn btn-outline" style="padding:6px 12px;font-size:0.8rem" onclick="viewJob('${job.id}')">📖 查看</button>
            <button class="btn btn-danger" onclick="deleteJob('${job.id}')">🗑</button>
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    listEl.innerHTML = `<div class="job-empty">加载失败: ${err.message}</div>`;
  }
}

// ═══════════════════════════════════════════════════════
// View Job Detail
// ═══════════════════════════════════════════════════════
async function viewJob(jobId) {
  try {
    const job = await api(`/api/jobs/${jobId}`);
    const modal = document.getElementById('modal');
    const body = document.getElementById('modalBody');

    const statusLabel = job.status === 'pending' ? '⏳ 等待处理' :
                        job.status === 'running' ? '🔄 处理中' :
                        job.status === 'completed' ? '✅ 已完成' : '❌ 失败';

    body.innerHTML = `
      <h2>${job.bvid}</h2>
      <div class="modal-section">
        <h3>状态</h3>
        <div class="content">${statusLabel}</div>
      </div>
      <div class="modal-section">
        <h3>视频标题</h3>
        <div class="content">${job.title || '（暂无）'}</div>
      </div>
      <div class="modal-section">
        <h3>提交时间</h3>
        <div class="content">${formatTime(job.created_at)}</div>
      </div>
      ${job.video_url ? `
      <div class="modal-section">
        <h3>视频链接</h3>
        <div class="content"><a href="${job.video_url}" target="_blank">${job.video_url}</a></div>
      </div>` : ''}
      ${job.summary ? `
      <div class="modal-section">
        <h3>🤖 AI 总结</h3>
        <div class="content">${job.summary.replace(/\n/g, '<br>')}</div>
      </div>` : ''}
      ${job.error ? `
      <div class="modal-section">
        <h3 style="color:var(--danger)">错误信息</h3>
        <div class="content" style="color:var(--danger)">${job.error}</div>
      </div>` : ''}
      <div style="margin-top:16px;display:flex;gap:8px">
        ${job.status === 'pending' ? '<span style="font-size:0.85rem;color:var(--text-muted)">自动刷新中…</span>' : ''}
        ${job.summary ? `<button class="btn btn-primary" onclick="copySummary('${escapeHtml(JSON.stringify(job.summary))}')">📋 复制总结</button>` : ''}
      </div>
    `;

    modal.style.display = 'flex';

    // Poll if pending
    if (job.status === 'pending' || job.status === 'running') {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const updated = await api(`/api/jobs/${jobId}`);
          if (updated.status === 'completed' || updated.status === 'failed') {
            clearInterval(pollTimer);
            closeModal();
            refreshList();
            showToast(updated.status === 'completed' ? '✅ 处理完成！' : '❌ 处理失败', updated.status === 'failed');
          }
        } catch {}
      }, POLL_INTERVAL);
    }
  } catch (err) {
    showToast('❌ ' + err.message, true);
  }
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  clearInterval(pollTimer);
}

function copySummary(jsonStr) {
  const summary = JSON.parse(jsonStr);
  navigator.clipboard.writeText(summary).then(() => {
    showToast('✅ 已复制到剪贴板');
  }).catch(() => {
    showToast('❌ 复制失败', true);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ═══════════════════════════════════════════════════════
// Delete Job
// ═══════════════════════════════════════════════════════
async function deleteJob(jobId) {
  if (!confirm('确定要删除这个任务吗？')) return;
  try {
    await api(`/api/jobs/${jobId}`, { method: 'DELETE' });
    showToast('✅ 已删除');
    refreshList();
  } catch (err) {
    showToast('❌ ' + err.message, true);
  }
}

// ═══════════════════════════════════════════════════════
// Tab Switching
// ═══════════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(el => {
    el.style.display = el.id === `tab-${tab}` ? 'block' : 'none';
  });
  if (tab === 'history') refreshList();
}

// ═══════════════════════════════════════════════════════
// Utils
// ═══════════════════════════════════════════════════════
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)} 小时前`;
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ═══════════════════════════════════════════════════════
// Auto refresh status badge
// ═══════════════════════════════════════════════════════
setInterval(async () => {
  try {
    const stats = await api('/api/stats');
    const badge = document.getElementById('statusBadge');
    badge.innerHTML = `📦 ${stats.completed_jobs}/${stats.max_results} 条结果 · ${stats.pending_jobs} 待处理`;
  } catch {}
}, 30000);
</script>
